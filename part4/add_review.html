<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="triangle-background"></div>
    <div class="triangle-background-bottom"></div>
    <header>
        <img src="images/logo.png" alt="Logo HBNB" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="add_review.html">Review</a>
            <a href="place.html">Place</a>
        </nav>
        <a href="login.html" class="login-button">Login</a>
    </header>
    <main>
        <div class="review-layout">

            <!-- Formulaire d'ajout d'avis -->
            <form id="review-form" class="review-form">
                <h2>Ajouter un avis</h2>

                <label for="review">Votre avis :</label>
                <textarea id="review-text" name="review-text" required></textarea>

                <label for="rating">Note :</label>
                <select id="rating" name="rating" required>
                    <option value="" disabled selected>Choisissez une note</option>
                    <option value="1">1 ⭐</option>
                    <option value="2">2 ⭐</option>
                    <option value="3">3 ⭐</option>
                    <option value="4">4 ⭐</option>
                    <option value="5">5 ⭐</option>
                </select>

                <button type="submit" class="submit-button">Envoyer</button>
            </form>

            <div id="floating-confirmation">
                <span id="confirmation-text">Merci, votre avis a été envoyé !</span>
                <button id="close-confirmation">&times;</button>
            </div>

            <!-- Enveloppe animée -->
            <div class="letter-image">
                <div class="animated-mail">
                    <div class="back-fold"></div>

                    <div class="letter">
                        <div class="letter-border"></div>
                        <div class="letter-title"></div>
                        <div class="letter-context"></div>
                        <div class="letter-stamp"></div>
                    </div>

                    <div class="top-fold"></div>
                    <div class="body"></div>
                    <div class="left-fold"></div>
                </div>

                <div class="shadow"></div>
            </div>

        </div>
    </main>
    <script src="add-review.js"></script>
    <footer>
        <p>&copy; 2024 HBNB. All rights reserved.</p>
    </footer>
</body>
</html>
