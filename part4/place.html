<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Fond avec triangles -->
    <div class="triangle-background"></div>
    <div class="triangle-background-bottom"></div>
    
    <!-- Header -->
    <header>
        <img src="images/logo.png" alt="Logo HBNB" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="add_review.html">Review</a>
            <a href="place.html">Place</a>
        </nav>
        <a href="login.html" class="login-button">Login</a>
    </header>
    
    <!-- Contenu principal -->
    <main>
        <!-- SECTION 1 : Détails du logement (remplie par JavaScript) -->
        <section id="place-details">
            <!-- Le JavaScript va insérer le HTML ici -->
            <div style="text-align: center; padding: 40px;">
                <p>⏳ Chargement des détails du logement...</p>
            </div>
        </section>
        
        <!-- SECTION 2 : Avis (remplie par JavaScript) -->
        <section id="reviews">
            <!-- Le JavaScript va insérer les avis ici -->
        </section>
        
        <!-- SECTION 3 : Formulaire d'ajout d'avis (caché si non connecté) -->
        <section id="add-review" style="display: none;">
            <h2>Ajouter un avis</h2>
            <form id="review-form">
                <label for="review-text">Votre commentaire :</label>
                <textarea id="review-text" name="review-text" required rows="4"></textarea>
                
                <label for="review-rating">Note :</label>
                <select id="review-rating" required>
                    <option value="">Choisir une note</option>
                    <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="4">⭐⭐⭐⭐☆ (4/5)</option>
                    <option value="3">⭐⭐⭐☆☆ (3/5)</option>
                    <option value="2">⭐⭐☆☆☆ (2/5)</option>
                    <option value="1">⭐☆☆☆☆ (1/5)</option>
                </select>
                
                <button type="submit">Envoyer mon avis</button>
            </form>
        </section>
        
        <!-- Bouton alternatif si non connecté (optionnel) -->
        <div id="login-prompt" style="display: none; text-align: center; margin: 30px 0;">
            <p>Vous devez être connecté pour ajouter un avis</p>
            <a href="login.html" class="details-button">Se connecter</a>
        </div>
    </main>
    
    <!-- Scripts JavaScript -->
    <script src="place-details.js"></script> <!-- Le nouveau script de l'exercice 3 -->
    <script src="scripts.js"></script>        <!-- Ton script existant -->
    
    <!-- Footer -->
    <footer>
        <p>&copy; 2024 HBNB. All rights reserved.</p>
    </footer>
</body>
</html>
